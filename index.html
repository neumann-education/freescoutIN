    <!-- JavaScript Libraries -->

    <!-- Form Logic Script (Adaptado para JVN) -->
    <script>
        var zsAttachedAttachmentsCount = 0;
        var zsAllowedAttachmentLimit = 5; // Límite de Zoho
        var zsAttachmentFileBrowserIdsList = [1, 2, 3, 4, 5]; // Para manejar los 5 inputs
        var zsCloudPickerJSON = {}; // Si usaras cloud picker de Zoho
        var ZSEncoder = {encodeForHTML : function(str){if(str && typeof(str)==='string'){return jQuery.encoder.encodeForHTML(str);}return str;}};


        // Funciones de dependencia de campos (generalmente no usadas en formularios simples de Zoho Desk)
        function trimBoth(str) { return jQuery.trim(str); }
        function getMapDependenySelectValues(module, key){ var dependencyObj = jQuery.parseJSON( jQuery("[id='dependent_field_values_" + module + "']").val() ); if(dependencyObj == undefined){return dependencyObj;} return dependencyObj[key]; }
        function setDependent(obj, isload){ /* ... Lógica original de Zoho ... Esta función es compleja y usualmente no necesaria si no tienes campos dependientes configurados en Zoho Desk para este formulario. La he omitido por brevedad pero puedes reinsertarla si es vital y está configurada.*/ }
        function setAllDependancyFieldsMapping() {
            var formName = 'zsWebToCase_1136017000000376367'; // JVN Form Name
            var mapDependancyLabels = getMapDependenySelectValues(jQuery("[id='property(module)']").val(), "JSON_MAP_DEP_LABELS");
            if (mapDependancyLabels) {
                for (var i = 0; i < mapDependancyLabels.length; i++) {
                    var label = mapDependancyLabels[i];
                    var obj = document.forms[formName][label];
                    if (obj) {
                        setDependent(obj, true);
                    }
                }
            }
        }
        
        // Form initialization on document ready
        document.addEventListener('DOMContentLoaded', function() { // Cambiado a DOMContentLoaded
            if (window.zsRegenerateCaptcha) { // Si usaras captcha de Zoho
                zsRegenerateCaptcha();
            }
            setAllDependancyFieldsMapping();
            if(document.getElementById('zsSubmitButton_1136017000000376367')) {
                document.getElementById('zsSubmitButton_1136017000000376367').removeAttribute('disabled');
            }
            // Inicializar manejo de adjuntos
            initAttachmentLogic();
        });

        function initAttachmentLogic() {
            zsAttachedAttachmentsCount = 0;
            zsAttachmentFileBrowserIdsList = [1, 2, 3, 4, 5];
            jQuery('#zsFileBrowseAttachments').html(''); // Limpiar lista de adjuntos visual
             // Ocultar todos los inputs de archivo excepto el primero
            for (let i = 2; i <= 5; i++) {
                jQuery('#zsattachment_' + i).hide();
            }
            jQuery('#zsattachment_1').show();
            updateAttachmentMessages();
        }
        
        // Form Reset Function
        function zsResetWebForm(webFormId) {
            var formName = 'zsWebToCase_' + webFormId;
            if(document.forms[formName]) {
                document.forms[formName].reset();
            }
            if(document.getElementById('zsSubmitButton_1136017000000376367')) {
                 document.getElementById('zsSubmitButton_1136017000000376367').removeAttribute('disabled');
            }
            setAllDependancyFieldsMapping();
            
            // Resetear adjuntos
            initAttachmentLogic();

            // Si usas CloudPicker
            zsCloudPickerJSON = {};
            if (document.forms[formName] && document.forms[formName]['zsCloudPickerAttachments']) {
                document.forms[formName]['zsCloudPickerAttachments'].value = JSON.stringify({});
            }
        }
        
        // File attachment handling functions
        function zsOpenFileBrowseAttachment(event, inputElement) {
            if (zsAttachedAttachmentsCount >= zsAllowedAttachmentLimit) {
                event.preventDefault(); // No permitir abrir si ya alcanzó el límite
                return;
            }
        }
        
        function zsRenderBrowseFileAttachment(inputElement) {
            if (inputElement.files.length === 0) return; // No hacer nada si no se seleccionó archivo
            
            var file = inputElement.files[0];
            var fileName = file.name;
            var inputIdNum = parseInt(inputElement.id.replace('zsattachment_', ''));

            // Validar tamaño (20MB)
            if (file.size / (1024 * 1024) > 20) {
                alert('El tamaño de archivo máximo permitido es 20MB.');
                inputElement.value = ''; // Limpiar el input
                return;
            }

            // Validar extensiones (misma lista que en el código original de Zoho)
            var extension = fileName.split('.').pop().toLowerCase();
            var unSupportedExtensions = ["ade","adp","apk","appx","appxbundle","bat","cab","cer","chm","cmd","com","cpl","dll","dmg","exe","hlp","hta","ins","iso","isp","jar","js","jse","lnk","mde","msc","msi","msix","msixbundle","msp","mst","nsh","pif","ps1","pst","reg","scr","sct","shb","sys","tmp","url","vb","vbe","vbs","vxd","wsc","wsf","wsh","terminal"];
            if (unSupportedExtensions.indexOf(extension) != -1) {
                alert("El archivo no se ha adjuntado porque su extensión no es compatible.");
                inputElement.value = ''; // Limpiar
                return;
            }

            if (zsAttachedAttachmentsCount < zsAllowedAttachmentLimit) {
                // Mostrar el nombre del archivo
                var fileDisplayId = 'file_display_' + inputIdNum;
                if (jQuery('#' + fileDisplayId).length > 0) { // Si ya hay un display para este input, lo actualiza
                    jQuery('#' + fileDisplayId + ' .file-name-text').text(ZSEncoder.encodeForHTML(fileName));
                } else { // Si no, crea uno nuevo
                     var fileObj = jQuery(
                        '<div class="filenamecls" id="' + fileDisplayId + '">' +
                        '<span class="file-name-text">' + ZSEncoder.encodeForHTML(fileName) + '</span>' +
                        '<span class="closefunction" onclick="zsRemoveFileAttachment(' + inputIdNum + ')">X</span>' +
                        '</div>'
                    );
                    jQuery('#zsFileBrowseAttachments').append(fileObj);
                    
                    // Ocultar este input y mostrar el siguiente si hay disponibles
                    jQuery(inputElement).hide();
                    zsAttachedAttachmentsCount++;
                    var nextId = findNextAvailableInputId();
                    if (nextId) {
                        jQuery('#zsattachment_' + nextId).show();
                    }
                }
            }
            updateAttachmentMessages();
        }
        
        function findNextAvailableInputId() {
            for (let i = 1; i <= 5; i++) {
                if (jQuery('#zsattachment_' + i).is(':hidden') && jQuery('#zsattachment_' + i).val() === '') {
                     // Chequear si ya tiene un display asociado, para evitar mostrar uno que ya está "en uso" visualmente
                    if (jQuery('#file_display_' + i).length === 0) {
                        return i;
                    }
                } else if (jQuery('#zsattachment_' + i).is(':visible') && jQuery('#zsattachment_' + i).val() === '') {
                    return i; // Si está visible y vacío, es el actual para usar
                }
            }
             // Si todos los inputs visibles ya tienen archivo O todos los ocultos tienen display
            // buscar el primero oculto que no tenga display aún.
            for (let i = 1; i <= 5; i++) {
                if (jQuery('#zsattachment_' + i).is(':hidden') && jQuery('#file_display_' + i).length === 0) {
                    return i;
                }
            }
            return null; // No hay más inputs disponibles
        }

        function zsRemoveFileAttachment(inputIdNum) {
            jQuery('#file_display_' + inputIdNum).remove();
            var inputElement = jQuery('#zsattachment_' + inputIdNum);
            inputElement.val(''); // Limpiar el valor del input de archivo
            
            zsAttachedAttachmentsCount--;

            // Reorganizar: mostrar este input si no hay otro visible y vacío
            var currentVisibleEmpty = false;
            for(let i=1; i<=5; i++) {
                if(jQuery('#zsattachment_' + i).is(':visible') && jQuery('#zsattachment_' + i).val() === '') {
                    currentVisibleEmpty = true;
                    break;
                }
            }
            if (!currentVisibleEmpty && zsAttachedAttachmentsCount < zsAllowedAttachmentLimit) {
                 inputElement.show();
            } else {
                // Si ya hay uno visible y vacío, o se alcanzó el límite, mantener oculto éste
                // y asegurarse de que haya uno visible si no se alcanzó el límite.
                if (zsAttachedAttachmentsCount < zsAllowedAttachmentLimit) {
                    var nextId = findNextAvailableInputId();
                    if(nextId && jQuery('#zsattachment_' + nextId).is(':hidden')){
                        jQuery('#zsattachment_' + nextId).show();
                    } else if (!nextId && !currentVisibleEmpty) {
                        // Caso raro: si no hay nextId pero tampoco hay visible y vacío, mostrar el primero vacío que esté oculto
                         for (let i = 1; i <= 5; i++) {
                            if (jQuery('#zsattachment_' + i).is(':hidden') && jQuery('#zsattachment_' + i).val() === '') {
                                jQuery('#zsattachment_' + i).show();
                                break;
                            }
                        }
                    }
                }
            }
            updateAttachmentMessages();
        }
        
        function updateAttachmentMessages() {
            if (zsAttachedAttachmentsCount >= zsAllowedAttachmentLimit) {
                jQuery('#zsMaxLimitMessage').show();
                 // Ocultar todos los inputs de archivo que estén visibles y vacíos
                for(let i = 1; i <= 5; i++) {
                    if(jQuery('#zsattachment_' + i).is(':visible') && jQuery('#zsattachment_' + i).val() === '') {
                        jQuery('#zsattachment_' + i).hide();
                    }
                }
            } else {
                jQuery('#zsMaxLimitMessage').hide();
                // Asegurarse que al menos un input esté visible si no se ha alcanzado el límite
                let oneVisible = false;
                for(let i = 1; i <= 5; i++) {
                    if(jQuery('#zsattachment_' + i).is(':visible')) {
                        oneVisible = true;
                        break;
                    }
                }
                if(!oneVisible) {
                    let nextIdToShow = findNextAvailableInputId();
                    if(nextIdToShow) jQuery('#zsattachment_' + nextIdToShow).show();
                }
            }
        }
        
        // Validation function (Adaptada para JVN)
        function zsValidateMandatoryFields() {
            var form = document.forms['zsWebToCase_1136017000000376367'];
            // Campos obligatorios para JVN
            var mandatoryFields = {
                'First Name': 'Nombre',
                'Contact Name': 'Apellidos',
                'Email': 'Correo electrónico',
                'Subject': 'Asunto',
                'Description': 'Descripción'
            };
            var isError = false;
            
            for (var fieldName in mandatoryFields) {
                if (mandatoryFields.hasOwnProperty(fieldName)) {
                    var fieldObj = form[fieldName];
                    if (fieldObj) {
                        // Quitar .manfieldbdr para usar la validación de Bootstrap o :required
                        // jQuery(fieldObj).removeClass('manfieldbdr'); 
                        if (fieldObj.value.trim() === '') {
                            alert(mandatoryFields[fieldName] + ' no puede estar vacío.');
                            fieldObj.focus();
                            // jQuery(fieldObj).addClass('manfieldbdr'); // O aplicar una clase de error de Bootstrap
                            isError = true;
                            return false; // Detener en el primer error
                        }
                    }
                }
            }
            
            // Validación de Email
            var emailObj = form['Email'];
            if (emailObj && emailObj.value.trim() !== '') {
                // Regex más simple y común para email
                if (!/^\S+@\S+\.\S+$/.test(emailObj.value.trim())) {
                    alert('Por favor, introduce una dirección de correo electrónico válida.');
                    emailObj.focus();
                    isError = true;
                    return false;
                }
            }
            
            if (!isError) {
                // Deshabilitar botón de envío para prevenir múltiples envíos
                if(document.getElementById('zsSubmitButton_1136017000000376367')) {
                    document.getElementById('zsSubmitButton_1136017000000376367').setAttribute('disabled', 'disabled');
                }
            }
            return !isError;
        }
    </script>
